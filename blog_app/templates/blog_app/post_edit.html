{% extends "base.html" %}

{% block article %}
    <form method="post">{% csrf_token %}
        {{ post_form }}
        <div id="contents">
            <div class="content-item">
                
            </div>
        </div>
        <input type="submit" value="Update">
    </form>
    <button type="button" id="add-content">Add Content</button>
    <script>
    // 초기 데이터 리스트를 템플릿에서 가져와 JavaScript 변수로 만듭니다.
    const initialData = {{ initial_contents_data|safe }};
    const contentsDiv = document.getElementById('contents');
        
    document.addEventListener('DOMContentLoaded', (event) => {
        let index=0;
        for (const node in initialData) {
            addContentForm(initialData[node], index);
            index+=1;
        }
    });
        
    function addContentForm(data, index) {
        console.log(data)
        const contentItem = document.createElement('div');
        contentItem.innerHTML = `
        <div class="content-item">
            <label>Content Type:</label>
            <select name="content_type">
                <option value="text" ${data.content_type === 'text' ? 'selected' : ''}>Text</option>
                <option value="image" ${data.content_type === 'image' ? 'selected' : ''}>Image</option>
                <option value="youtube" ${data.content_type === 'youtube' ? 'selected' : ''}>Youtube</option>
            </select>
            <label>Text:</label>
            <textarea name="text" style="width:100%;height:150px;" >${data.text}</textarea>
            <label>Image:</label>
            <input type="file" name="image">
            <input type="hidden" name="order" class="content-order" value="${index}">
        </div>
        `;
        contentsDiv.appendChild(contentItem);
    }

        // JavaScript to dynamically add content blocks
        document.getElementById('add-content').addEventListener('click', function() {
            const contentsDiv = document.getElementById('contents');
            const newContent = document.createElement('div');
            newContent.innerHTML = `
                    <div class="content-item">
                        <label>Content Type:</label>
                        <select name="content_type">
                            <option value="text">Text</option>
                            <option value="image">Image</option>
                            <option value="youtube">Youtube</option>
                        </select>
                        <label>Text:</label>
                        <textarea name="text" style="width:100%;height:150px;"></textarea>
                        <label>Image:</label>
                        <input type="file" name="image">
                    </div>
                `;
            const orderInputs = contentsDiv.getElementsByClassName('content-order');
            
            const orderInput = document.createElement('input');
            orderInput.type = 'hidden';
            orderInput.name = 'order';
            orderInput.className = 'content-order';
            orderInput.value = orderInputs.length;
            newContent.appendChild(orderInput);
            
            contentsDiv.appendChild(newContent);
        });
    </script>
{% endblock %}
