<div class="container">
    <header class="border-bottom lh-1 py-3">
      <div class="row flex-nowrap justify-content-between align-items-center">
        <div class="col-4 pt-1">
          <a class="link-secondary" href="#">Subscribe</a>
        </div>
        <div class="col-4 text-center">
          <a class="blog-header-logo text-body-emphasis text-decoration-none" href="#">Large</a>
        </div>
        <div class="col-4 d-flex justify-content-end align-items-center">
          <a class="link-secondary" href="#" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" strokse-width="2" class="mx-3" role="img" viewBox="0 0 24 24"><title>Search</title><circle cx="10.5" cy="10.5" r="7.5"></circle><path d="M21 21l-5.2-5.2"></path></svg>
          </a>
          {% if user.is_authenticated %}
            {{ user.username }}
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'common:logout' %}">logout</a>
          {% else %}
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'common:login' %}">login</a>
          {% endif %}
          <a class="btn btn-sm btn-outline-secondary" href="{% url 'common:signup' %}">Sign up</a>
        </div>
      </div>
    </header>

    <div id="top-link-list" class="nav-scroller py-1 mb-3 border-bottom">
      <nav class="nav nav-underline justify-content-between">
        <a class="nav-item nav-link link-body-emphasis {% if 'blog_app' in request.path %} active{% endif %}" href="{% url 'blog_app:index' %}">Common blog</a>
        <a class="nav-item nav-link link-body-emphasis {% if 'focus_tree' in request.path %} active{% endif %}" href="{% url 'focus_tree:index' %}">focus tree</a>
        <a class="nav-item nav-link link-body-emphasis {% if 'code_converter' in request.path %} active{% endif %}" href="{% url 'code_converter:index' %}">code convert</a>
        <a class="nav-item nav-link link-body-emphasis {% if 'game' in request.path %} active{% endif %}" href="{% url 'game:index' %}">game</a>
      </nav>
    </div>
  </div>
