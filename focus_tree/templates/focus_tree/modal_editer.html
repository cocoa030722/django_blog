<!-- 노드 생성 모달:시작-->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">New node</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form action="{% url 'focus_tree:ajax_save_one' tree.id %}" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="submit" value="Submit">
        </form>
      </div>

      <div class="modal-footer">

      </div>

    </div>
  </div>
</div>
<!-- 노드 생성 모달:끝 -->
<!-- 노드 세부사항 모달:시작 -->
<div class="modal fade" id="nodeDetailModal" tabindex="-1" aria-labelledby="nodeDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="nodeDetailModalLabel">Node Details</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <div class="container text-center">
          <div class="row">
            <div class="col-12">
              name:<div id="nodeNameText"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-3">
              image:<div id="nodeImage"></div>
            </div>
            <div class="col-9">
              placeholder
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              mainText:<div id="nodeMainText"></div>
            </div>
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<!-- 노드 세부사항 모달:끝 -->
